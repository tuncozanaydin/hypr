general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2eff)
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    placeholder_text = Password...
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

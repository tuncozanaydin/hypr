# Hyprland config — basic starter setup
# Wiki: https://wiki.hypr.land/Configuring/
# Reload is automatic on save. Check errors with: hyprctl configerrors

################
### MONITORS ###
################

# name, resolution, position, scale. `hyprctl monitors` lists outputs.
# e.g. monitor = DP-1, 2560x1440@165, 0x0, 1
# Default: preferred mode at 125% (same as Ubuntu's 125% setting).
# Per-machine overrides (monitor scale, etc.) go in local.d/*.conf, see the end of this file.
monitor = , preferred, auto, 1.25

###################
### PROGRAMS    ###
###################

$terminal    = kitty
$menu        = fuzzel
$fileManager = nautilus
$lock        = hyprlock

#################
### ENV / GPU ###
#################

# NVIDIA (RTX 4070 Ti, proprietary/open driver)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Wayland-native toolkits where possible
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/libexec/hyprpolkitagent
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e95420ff) rgba(ff8a50ff) 45deg  # Ubuntu orange
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    layout = master
}

decoration {
    rounding = 6

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = global,     1, 8,  default
    animation = windows,    1, 4,  easeOutQuint, popin 87%
    animation = fade,       1, 3,  default
    animation = workspaces, 1, 3,  default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Centered master: the main window sits in the middle, others stack left/right.
master {
    orientation = center
    slave_count_for_center_master = 0   # center the master even with 0-1 other windows
    always_keep_position = true         # a lone window stays centered instead of filling the screen
    mfact = 0.5
}

# NVIDIA: keep hardware cursors ON (default, via use_cpu_buffer). Forcing
# software cursors (no_hardware_cursors = true) leaves GDM's cursor stuck on
# the cursor plane, showing up as a frozen extra pointer.
cursor {
    no_hardware_cursors = 0
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # Re-launching an already running app (e.g. Spotify) switches to it instead
    # of only marking its workspace urgent (red in waybar)
    focus_on_activate = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

$mod = SUPER

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod, Space,  exec, $menu
bind = $mod, E,      exec, $fileManager
bind = $mod, L,      exec, $lock
bind = $mod, F1,     exec, pkill -x fuzzel || ~/.config/hypr/scripts/keybinds.py

# Windows
bind = $mod, Q,       killactive,
bind = $mod, F,       fullscreen,
bind = $mod, V,       togglefloating,
bindd = $mod, J,      Swap with main window (dwindle: toggle split), exec, ~/.config/hypr/scripts/layout.sh swap

# Layouts (scripts/layout.sh): center/left per workspace, dwindle for all
bindd = $mod, Tab,       Layout of this workspace: center / left, exec, ~/.config/hypr/scripts/layout.sh toggle
bindd = $mod SHIFT, Tab, Dwindle layout on/off (all workspaces), exec, ~/.config/hypr/scripts/layout.sh dwindle
bind = $mod SHIFT, E, exit,

# Focus (arrows)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move windows (Shift + arrows)
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize (Ctrl + arrows, repeats while held)
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Scratchpad
bind = $mod, S,       togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Mouse: Super + LMB drag = move, Super + RMB drag = resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots (saved to ~/Pictures/Screenshots and copied to clipboard)
bind = ,      Print, exec, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png | wl-copy

# Media / volume keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioPause,       exec, playerctl play-pause

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-dialogs
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor)$
    float = yes
}

#############################
### PER-MACHINE OVERRIDES ###
#############################

# Untracked files in local.d/ (e.g. written by hyprland.sh --scale) override
# anything above. local.d/00-readme.conf is tracked so this glob always matches.
source = ~/.config/hypr/local.d/*.conf
